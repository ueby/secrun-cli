# Configuração do GoReleaser v2 (https://goreleaser.com)
#
# Release:   workflow manual "Release" (.github/workflows/release.yml). O
#            semantic-release cria a tag vX.Y.Z e as notas; o GoReleaser é
#            chamado em seguida com --release-notes e publica os artefatos.
# Snapshot:  make snapshot   (artefatos locais em ./dist; usado no CI)
version: 2

project_name: secrun

before:
  hooks:
    - go mod tidy -diff # falha se go.mod/go.sum estiverem desatualizados (não altera nada)
    - go mod verify
    - go test ./...

builds:
  - id: secrun
    main: ./cmd/secrun
    binary: secrun
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ueby/secrun-cli/internal/version.Version=v{{ .Version }}
      - -X github.com/ueby/secrun-cli/internal/version.Commit={{ .FullCommit }}
      - -X github.com/ueby/secrun-cli/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}" # builds reprodutíveis
    # O secrun depende de syscall.Exec, por isso Windows não é suportado.
    goos: [linux, darwin]
    goarch: [amd64, arm64, arm, "386", ppc64le, s390x, riscv64]
    goarm: ["6", "7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: ppc64le
      - goos: darwin
        goarch: s390x
      - goos: darwin
        goarch: riscv64

archives:
  - formats: [tar.gz]
    # Nomes sem versão, para que .../releases/latest/download/<arquivo> funcione
    # (usado pelo install.sh). Ex.: secrun_linux_amd64.tar.gz, secrun_linux_armv7.tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: ueby
    name: secrun-cli
  extra_files:
    - glob: ./install.sh
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

# As notas da release são geradas pelo semantic-release (Conventional Commits)
# e entregues via --release-notes. NÃO use "disable: true": é o pipe de
# changelog que carrega o arquivo de --release-notes; desligado, a release sai
# sem notas (issue #5). Com --release-notes, nada é gerado a partir do git.
changelog:
  use: git
