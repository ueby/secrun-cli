name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GORELEASER_VERSION: v2.20.3
  IMAGE: ghcr.io/${{ github.repository_owner }}/secrun
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386,linux/ppc64le,linux/s390x,linux/riscv64

jobs:
  goreleaser:
    name: Binários e GitHub Release
    runs-on: ubuntu-latest
    # Publicação exige aprovação no environment "release" (Settings > Environments).
    environment: release
    permissions:
      contents: write # criar a release e enviar os assets
      id-token: write # assinar a atestação de proveniência (Sigstore)
      attestations: write # gravar a atestação no GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # release sem cache: nada de artefatos de execuções anteriores
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Proveniência SLSA dos binários. Verificação:
      #   gh attestation verify secrun_linux_amd64.tar.gz -R ueby/secrun-cli
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

  docker:
    name: Imagem ghcr.io (multi-arch)
    needs: goreleaser # só publica a imagem se a release (e seus testes) passou
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write # push para o GHCR
      id-token: write # assinar a atestação de proveniência (Sigstore)
      attestations: write # gravar a atestação no GitHub/registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Data do commit
        id: date
        run: echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          no-cache: true # release sem cache compartilhado (evita envenenamento de cache)
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.date }}
          provenance: mode=max
          sbom: true
      # Verificação: gh attestation verify oci://ghcr.io/ueby/secrun:<versão> -R ueby/secrun-cli
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
