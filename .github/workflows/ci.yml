name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # reutilizado pelo workflow Release antes de publicar

permissions:
  contents: read

concurrency:
  # github.workflow distingue a execução própria da chamada pelo Release,
  # que não pode ser cancelada por um push na main.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.10.0
  GORELEASER_VERSION: v2.20.3

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Verificar go.mod/go.sum
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verificar formatação
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: ShellCheck
        run: shellcheck -s sh install.sh test/e2e/install-and-run.sh

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: Testes (race + cobertura)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Resumo da cobertura
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fuzzing do parser
        if: matrix.os == 'ubuntu-latest'
        run: go test -run='^$' -fuzz=FuzzParse -fuzztime=30s ./internal/secrets

  vuln:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  build:
    name: Build (todas as arquiteturas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # artefatos de build não reaproveitam cache
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=publish
      - name: Inspecionar binários
        run: |
          {
            echo '### Binários gerados'
            echo '```'
            find dist -type f -name secrun -exec file {} \; | sed 's|dist/||' | sort
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 7

  install:
    name: Install (${{ matrix.image }} ${{ matrix.platform }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie-slim", "debian:bookworm-slim", "ubuntu:24.04", "alpine:3.24"]
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Subir servidor de artefatos e Secrets Manager falso
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory dist >/dev/null 2>&1 &
          go build -o /tmp/fakesm ./test/fakesm
          /tmp/fakesm -addr 127.0.0.1:18765 -secrets test/fakesm/secrets.json &
          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/checksums.txt >/dev/null && \
            curl -s -o /dev/null http://127.0.0.1:18765/ && break
            sleep 1
          done
      - name: Instalar e executar no container
        run: |
          docker run --rm --network host --platform "${{ matrix.platform }}" \
            -e SECRUN_INSTALL_BASE_URL=http://127.0.0.1:8000 \
            -e SECRUN_INSTALL_ALLOW_HTTP=1 \
            -e AWS_ENDPOINT_URL_SECRETS_MANAGER=http://127.0.0.1:18765 \
            -e AWS_ACCESS_KEY_ID=test -e AWS_SECRET_ACCESS_KEY=test -e AWS_REGION=us-east-1 \
            -v "$PWD/install.sh:/install.sh:ro" \
            -v "$PWD/test/e2e/install-and-run.sh:/test.sh:ro" \
            "${{ matrix.image }}" sh /test.sh

  docker:
    name: Docker image (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (sem push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386,linux/ppc64le,linux/s390x,linux/riscv64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
