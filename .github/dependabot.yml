version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns: ["github.com/aws/*"]
    commit-message:
      prefix: "fix" # dependência do binário: gera versão patch
      include: scope # → "fix(deps): ..."

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci" # não gera versão
      include: scope # → "ci(deps): ..."

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build" # imagem base do build: não gera versão
      include: scope # → "build(deps): ..."
